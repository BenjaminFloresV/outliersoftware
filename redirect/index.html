<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlier Software</title>
  <link rel="canonical" href="https://outlier-software.github.io/landing-page/">
  <script>
    // The routes live in the hash (#/android/app/...), so carrying the hash and the query is
    // enough for links that apps already shipped with. The path only matters on the 404 page.
    var path = location.pathname.replace(/^\/outliersoftware/, '') || '/';
    location.replace('https://outlier-software.github.io/landing-page' + path + location.search + location.hash);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://outlier-software.github.io/landing-page/">
  </noscript>
</head>
<body>
  <p>This site moved to <a href="https://outlier-software.github.io/landing-page/">outlier-software.github.io/landing-page</a>.</p>
</body>
</html>
